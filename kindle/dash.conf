# Kindle dashboard: starts after the stock UI is up, takes over the screen.
# Disable: create /mnt/us/dash/DISABLE. Exit until reboot: tap top-left corner 5x.
description "Kindle dashboard"

start on started framework

respawn
respawn limit 5 300
normal exit 0

pre-start script
    [ -f /mnt/us/dash/DISABLE ] && { stop; exit 0; }
    [ -f /tmp/dash_exited ] && { stop; exit 0; }
    sleep 20
end script

exec /mnt/us/python3/bin/python3.9 /mnt/us/dash/dash.py >> /mnt/us/dash/out.txt 2>&1
